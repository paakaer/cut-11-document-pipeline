[project]
name = "document-pipeline"
version = "0.1.0"
description = "Handwritten notebook pages to structured data, with human review and per-document accuracy and cost."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "anthropic>=0.70",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
